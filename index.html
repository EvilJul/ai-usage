<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AI 用量汇总</title>
<link rel="stylesheet" href="./style.css?v=a500bfdd">
</head>
<body>
<header>
  <h1>AI 用量汇总</h1>
  <div class="controls">
    <label>范围
      <select id="range">
        <option value="7">近 7 天</option>
        <option value="30" selected>近 30 天</option>
        <option value="90">近 90 天</option>
        <option value="365">近一年</option>
        <option value="all">全部</option>
      </select>
    </label>
    <label>设备 <select id="machine"><option value="">全部</option></select></label>
    <label>应用 <select id="app"><option value="">全部</option></select></label>
    <span id="status" class="status"></span>
  </div>
</header>

<main>
  <!-- 加密静态站：在页面上要口令，不用浏览器 prompt -->
  <section class="panel unlock" id="unlock" hidden>
    <h2>这个页面已加密</h2>
    <p class="hint">输入查看口令。口令只在这个浏览器里用于解密，不会发送到任何地方。</p>
    <form id="unlock-form" class="unlock-row">
      <input type="password" id="pass" placeholder="查看口令" autocomplete="current-password" required>
      <button type="submit" class="btn">打开</button>
    </form>
    <div id="unlock-msg" class="unlock-msg"></div>
  </section>

  <section class="cards" id="cards"></section>

  <section class="panel">
    <h2>每日用量</h2>
    <div id="chart" class="chart"></div>
  </section>

  <section class="panel">
    <h2>额度</h2>
    <p class="hint">额度是<b>账号级</b>的，跨设备不累加。同一账号多台机器上报时取最新观测，冲突会标注。</p>
    <div id="quotas" class="quotas"></div>
  </section>

  <div class="two-col">
    <section class="panel">
      <h2>按账号</h2>
      <div id="accounts"></div>
    </section>
    <section class="panel">
      <h2>按模型</h2>
      <div id="models"></div>
    </section>
  </div>

  <section class="panel">
    <h2>按设备</h2>
    <p class="hint">用量按设备相加（每台机器的请求都真实发生）；额度不参与相加。</p>
    <div id="machines"></div>
  </section>

  <section class="panel" id="admin-panel" hidden>
    <h2>账号管理</h2>
    <p class="hint">若同一账号在不同机器上名字不同，把它合并到一个账号下。合并只改归属，不改历史数据。</p>
    <div id="admin"></div>
  </section>
</main>

<footer>
  <span id="foot"></span>
</footer>
<script src="./app.js?v=84bab68c"></script>
</body>
</html>
