<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<title>AI 用量中心</title>
<link rel="stylesheet" href="./style.css?v=b812f48a">
</head>
<body>

<section class="gate" id="unlock" hidden>
  <div class="gate-inner">
    <div class="gate-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="4" y="11" width="16" height="10" rx="2"/>
        <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
      </svg>
    </div>
    <h1>需要查看口令</h1>
    <p class="gate-hint">口令仅在当前浏览器内存用于解密，不会上传到任何服务器。</p>
    <form id="unlock-form">
      <input type="password" id="pass" placeholder="查看口令" autocomplete="current-password"
             autocapitalize="off" autocorrect="off" spellcheck="false" required>
      <button type="submit">打开</button>
    </form>
    <div id="unlock-msg" class="gate-msg" role="alert"></div>
  </div>
</section>

<header class="bar">
  <div class="bar-inner">
    <h1 class="brand">AI 用量中心</h1>
    <span class="range-context num" id="range-context" role="status">正在加载…</span>
    <button type="button" class="sync-button" id="local-sync" hidden>同步本机用量</button>
    <nav class="tabs" id="range-tabs" aria-label="时间范围">
      <button type="button" data-days="1" aria-pressed="false">今天</button>
      <button type="button" data-days="7" aria-pressed="false">7 天</button>
      <button type="button" data-days="30" aria-pressed="true" class="on">30 天</button>
      <button type="button" data-days="0" aria-pressed="false">全部</button>
    </nav>
  </div>
</header>

<main>
  <p class="sync-status" id="sync-status" role="status" hidden></p>
  <section class="panel onboarding" id="onboarding" hidden>
    <h2>开始记录 AI 用量</h2>
    <p id="local-setup" hidden>还没有用量数据。点击右上角「同步本机用量」导入这台电脑的 cc-switch 记录。</p>
    <div id="manual-setup">
      <p>还没有收到采集端的数据，请安装桌面端或配置采集端上传。</p>
    </div>
  </section>

  <div id="dashboard" aria-busy="true">
    <section aria-labelledby="overview-title">
      <h2 id="overview-title" class="sr-only">用量概览</h2>
      <div class="kpis" id="kpis"></div>
    </section>

    <section class="panel trend-panel" aria-labelledby="trend-title">
      <div class="panel-head">
        <h2 id="trend-title">花费趋势</h2>
        <span class="panel-note num" id="chart-note"></span>
      </div>
      <div class="chart" id="chart"></div>
    </section>

    <section class="panel details-panel" aria-labelledby="details-title">
      <div class="panel-head"><h2 id="details-title">用量明细</h2></div>
      <nav class="detail-nav" id="detail-nav" aria-label="明细视图">
        <button type="button" data-view="models" aria-pressed="true">模型</button>
        <button type="button" data-view="accounts" aria-pressed="false">账号</button>
        <button type="button" data-view="tokens" aria-pressed="false">Token</button>
        <button type="button" data-view="quotas" aria-pressed="false">额度</button>
        <button type="button" data-view="machines" aria-pressed="false">设备</button>
      </nav>
      <div id="details"></div>
    </section>
  </div>
</main>

<footer id="foot"></footer>

<script src="./app.js?v=c1195f79"></script>
</body>
</html>
