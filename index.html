<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<title>AI 用量</title>
<link rel="stylesheet" href="./style.css?v=bdf1bfad">
</head>
<body>

<!-- 加密站的口令门 -->
<section class="gate" id="unlock" hidden>
  <div class="gate-inner">
    <div class="gate-icon" aria-hidden="true">🔒</div>
    <h1>已加密</h1>
    <p class="gate-hint">输入查看口令。口令只在本机浏览器里用于解密，不会发送到任何地方。</p>
    <form id="unlock-form">
      <input type="password" id="pass" placeholder="查看口令" autocomplete="current-password"
             autocapitalize="off" autocorrect="off" spellcheck="false" required>
      <button type="submit">打开</button>
    </form>
    <div id="unlock-msg" class="gate-msg" role="alert"></div>
  </div>
</section>

<header class="bar">
  <div class="bar-inner">
    <h1 class="brand">AI 用量</h1>
    <nav class="tabs" id="range-tabs" role="tablist" aria-label="时间范围">
      <button type="button" role="tab" data-days="1">今天</button>
      <button type="button" role="tab" data-days="7">7 天</button>
      <button type="button" role="tab" data-days="30" aria-selected="true" class="on">30 天</button>
      <button type="button" role="tab" data-days="0">全部</button>
    </nav>
  </div>
</header>

<main>

  <!-- 今天：最重要的数字放最前 -->
  <section class="today" id="today-block">
    <div class="today-main">
      <div class="today-label">今天</div>
      <div class="today-cost" id="today-cost">—</div>
      <div class="today-sub" id="today-sub"></div>
    </div>
    <div class="today-side" id="today-side"></div>
  </section>

  <section class="kpis" id="kpis"></section>

  <section class="panel">
    <div class="panel-head">
      <h2>每日花费</h2>
      <span class="panel-note" id="chart-note"></span>
    </div>
    <div class="chart" id="chart"></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>剩余额度</h2>
    </div>
    <p class="hint">额度按<b>账号</b>算，不是按设备。同一账号在多台机器上只显示一条。</p>
    <div class="quotas" id="quotas"></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>账号</h2>
      <span class="panel-note">按花费排序</span>
    </div>
    <div id="accounts"></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>模型</h2>
      <span class="panel-note">按花费排序</span>
    </div>
    <div id="models"></div>
  </section>

  <section class="panel" id="machines-panel" hidden>
    <div class="panel-head">
      <h2>设备</h2>
      <span class="panel-note">用量按设备相加</span>
    </div>
    <div id="machines"></div>
  </section>

  <section class="panel" id="admin-panel" hidden>
    <div class="panel-head"><h2>账号管理</h2></div>
    <p class="hint">同一账号在不同机器上名字不同时，合并到一个账号下。只改归属，不改历史。</p>
    <div id="admin"></div>
  </section>

</main>

<footer id="foot"></footer>

<script src="./app.js?v=5d65285f"></script>
</body>
</html>
